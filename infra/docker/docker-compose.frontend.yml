# # 前端容器编排
# （frontend + backend）
# 场景：容器化前端，nginx 反向代理后端 API

services:
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
    image: parabbs-frontend
    container_name: parabbs-frontend
    network_mode: host
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    image: parabbs-backend
    container_name: parabbs-backend
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    volumes:
      - ../../backend/resources/data/avatar:/data/parabbs/avatar
    restart: unless-stopped

# # 部署流程
# 1. 构建前端 (在 frontend/web/ 目录) :
#    npm run build && cp -r dist/ ../../infra/docker/frontend/
# 2. 打包后端 JAR (在 backend/bbs/ 目录) :
#    ./mvnw clean package -DskipTests && cp target/bbs.jar ../../infra/docker/backend/
# 3. 准备环境变量 (在项目根目录执行) :
#    cp infra/docker/backend/.env.example infra/docker/backend/.env
# 4. 启动 (在项目根目录执行) :
#    docker compose -f infra/docker/docker-compose.frontend.yml up -d
