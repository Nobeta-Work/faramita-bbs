# # 全栈编排
# frontend + backend + MySQL + Redis
# frontend 走 host 网络（直接代理宿主机 localhost:8080）
# backend / mysql / redis 走桥接网络，通过服务名互访
name: parabbs

services:
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
    image: parabbs-frontend
    container_name: parabbs-frontend
    network_mode: host
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    image: parabbs-backend
    container_name: parabbs-backend
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    volumes:
      - avatar_data:/data/parabbs/avatar
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: parabbs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: para_bbs
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../mysql/full-init.sql:/docker-entrypoint-initdb.d/00-full-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: parabbs-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ==========================
  # RabbitMQ | 消息队列
  # ==========================
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: parabbs-rabbitmq
    hostname: parabbs-rabbitmq
    env_file:
      - ./.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /parabbs
    ports:
      - "5672:5672" # Broker 服务端口
      - "15672:15672" # 面板端口
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  # ==========================
  # Elasticsearch | 搜索引擎
  # Kibana | ES 面板
  # ==========================
  elasticsearch:
    build:
      context: ../..
      dockerfile: infra/docker/middleware/elasticsearch.Dockerfile
    image: parabbs-elasticsearch:8.18.6
    container_name: parabbs-elasticsearch
    env_file:
      - ./.env
    environment:
      discovery.type: single-node
      cluster.name: parabbs
      node.name: parabbs-es01

      # 仅适用于本地开发或可信内网
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"

      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.6
    container_name: parabbs-kibana
    profiles:
      - tools
    env_file:
      - ./.env
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  avatar_data:
  mysql_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:

# # 部署流程
# 1. 构建前端 (在 frontend/web/ 目录) :
#    npm run build && cp -r dist/ ../../infra/docker/frontend/
# 2. 打包后端 JAR (在 backend/bbs/ 目录) :
#    ./mvnw clean package -DskipTests && cp target/bbs.jar ../../infra/docker/backend/
# 3. 准备环境变量 (.env 包含 MYSQL_ROOT_PASSWORD, REDIS_PASSWORD 等) :
#    cp infra/docker/backend/.env.example infra/docker/backend/.env
# 4. 启动 :
#    docker compose -f infra/docker/docker-compose.yml up -d
