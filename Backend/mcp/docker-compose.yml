name: parabbs-mcp

services:
  mcp:
    build:
      context: ../..
      dockerfile: backend/mcp/Dockerfile
    image: parabbs-mcp:0.1.0
    container_name: parabbs-mcp
    env_file:
      - .env
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - parabbs-services
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  parabbs-services:
    external: true