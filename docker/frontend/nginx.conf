server {
    listen 80;
    server_name localhost;

    # 图标
    location = /webIcon.png {
        root /faramita/index/bbs;
    }

    # 反向代理 API 到宿主机后端（host 网络模式）
    location /bbs/api/ {
        proxy_pass http://localhost:8080;
    }

    # 前端 SPA（vite base: /bbs）
    location /bbs/ {
        alias /faramita/index/bbs;
        index index.html;
        try_files $uri $uri/ /bbs/index.html;
    }

    # 根路径重定向
    location = / {
        return 301 /bbs/;
    }
}