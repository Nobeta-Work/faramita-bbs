# # 后端 java 程序容器编排

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: faramita-bbs-backend
    container_name: faramita-bbs-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/resources/data/avatar:/data/faramita-bbs/avatar
    env_file:
      - docker/backend/.env
    restart: unless-stopped

# # 部署流程
# 1. 打包 JAR 并迁移 (在 backend/bbs/ 目录执行) :
#   ./mvnw clean package -DskipTests && cp target/bbs.jar ../../docker/backend/
# 2. 准备环境变量 (在项目根目录执行) :
#   cp docker/backend/.env.example docker/backend/.env
# 3. 启动 (在项目根目录执行) :
#   docker compose -f docker/docker-compose.backend.yml up -d