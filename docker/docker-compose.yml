# # 全栈编排
# frontend + backend + MySQL + Redis
# frontend 走 host 网络（直接代理宿主机 localhost:8080）
# backend / mysql / redis 走桥接网络，通过服务名互访

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: faramita-bbs-frontend
    container_name: faramita-bbs-frontend
    network_mode: host
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: faramita-bbs-backend
    container_name: faramita-bbs-backend
    ports:
      - "8080:8080"
    env_file:
      - docker/backend/.env
    volumes:
      - avatar_data:/data/faramita-bbs/avatar
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: faramita-bbs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: faramita_bbs
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: faramita-bbs-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  avatar_data:
  mysql_data:
  redis_data:

# # 部署流程
# 1. 构建前端 (在 frontend/faramita-bbs-frontend/ 目录) :
#    npm run build && cp -r dist/ ../../docker/frontend/
# 2. 打包后端 JAR (在 backend/bbs/ 目录) :
#    ./mvnw clean package -DskipTests && cp target/bbs.jar ../../docker/backend/
# 3. 准备环境变量 (.env 包含 MYSQL_ROOT_PASSWORD, REDIS_PASSWORD 等) :
#    cp docker/backend/.env.example docker/backend/.env
# 4. 启动 :
#    docker compose -f docker/docker-compose.yml up -d